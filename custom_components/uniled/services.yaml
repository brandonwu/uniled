set_state:
  name: Set State
  description: Set the state of a UniLED entity.
  target:
    entity:
      integration: uniled
      domain: light
  fields:
    power:
      name: Power
      description: Turn the light on or off. Leave out to keep the power as it is.
      selector:
        boolean:
    effect:
      name: Effect
      description: Light effect.
      selector:
        text:
    effect_speed:
      name: Effect Speed
      description: Set the speed of an effect.
      selector:
        number:
          min: 0
          max: 255
    effect_length:
      name: Effect Length
      description: Set the length of an effect.
      selector:
        number:
          min: 0
          max: 255
    effect_direction:
      name: Effect Direction
      description: Set the direction of an effect.
      default: true
      selector:
        boolean:
    sensitivity:
      name: Input Sensitivity
      description: Set the input sensitivity.
      selector:
        number:
          min: 0
          max: 255
    rgb_color:
      name: Primary color
      description: The primary color for the light (based on RGB - red, green, blue).
      selector:
        color_rgb:
    rgbw_color:
      name: Primary RGBW-color
      description: A list containing four integers between 0 and 255 representing the primary RGBW (red, green, blue, white) color for the light.
      advanced: true
      example: "[255, 100, 100, 50]"
      selector:
        object:
    rgb2_color:
      name: Secondary RGB Color
      description: Secondary Effect color (only supported by some devices in certain modes).
      example: "[255, 100, 100]"
      selector:
        object:
    white:
      name: White
      description:
        Set the light to white mode and change its brightness, where 0 turns
        the light off, 1 is the minimum brightness and 255 is the maximum
        brightness supported by the light.
      advanced: true
      selector:
        number:
          min: 0
          max: 255
    brightness:
      name: Brightness value
      description: Number indicating brightness, where 0 turns the light
        off, 1 is the minimum brightness and 255 is the maximum brightness
        supported by the light.
      advanced: true
      selector:
        number:
          min: 0
          max: 255
set_music_mode:
  name: Set Music Mode
  description: Switch the light to a sound-reactive (music) mode.
  target:
    entity:
      integration: uniled
      domain: light
  fields:
    effect:
      name: Sound Effect
      description: Name of the sound effect/pattern to run.
      selector:
        text:
    white:
      name: White
      description: Use the sound white mode instead of sound color.
      default: false
      selector:
        boolean:
    audio_input:
      name: Audio Input
      description: Audio input source (device specific, e.g. "Internal Microphone").
      selector:
        text:
    sensitivity:
      name: Input Sensitivity
      description: Set the audio input sensitivity.
      selector:
        number:
          min: 1
          max: 255
set_diy_colors:
  name: Set DIY Colors
  description: Upload a DIY (custom colour) segment definition for a custom effect to the device, in the same format the BanlanX app uses. Segments play in order along the strip; each segment's start position is computed from the lengths of the segments before it.
  target:
    entity:
      integration: uniled
      domain: light
  fields:
    effect:
      name: Custom Effect
      description: Name of the custom effect to define (e.g. "Chase Forward", "Twinkle", "Fade").
      required: true
      selector:
        text:
    segments:
      name: Segments
      description: List of segments, each with "pixels" (segment length in pixels, 1-150) and "rgb" (a [red, green, blue] list, 0-255 each). At most 14 segments (the device's DIY table size), and segments must start within the first 256 pixels of the strip.
      required: true
      example: '[{"pixels": 10, "rgb": [255, 0, 0]}, {"pixels": 10, "rgb": [0, 0, 255]}]'
      selector:
        object:
    play:
      name: Play
      description: Switch the light to the custom effect after uploading the definition.
      default: true
      selector:
        boolean:
